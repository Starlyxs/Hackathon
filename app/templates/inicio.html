<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/logo.png">
  <link rel="stylesheet" href="/static/app.css">
  <title>Inicio · Hojas en papel</title>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/static/logo.png" alt="">
      <h1>Hojas en papel</h1>
    </div>
    <!--NAV-->
  </header>
  <main>
    <section class="next" id="siguiente">
      <h2>Cargando…</h2>
    </section>

    <section id="tutorial" hidden>
      <h2>¿Primera vez? Mira el tutorial</h2>
      <p class="lede">Dura poco más de un minuto y no necesita sonido: los pasos se leen en pantalla. Va desde crear el examen hasta ver qué le falta a cada alumno.</p>
      <video id="video" controls preload="none" playsinline poster="/static/tutorial-poster.png" style="width:100%; max-width:none; aspect-ratio:16/9; border-radius:14px; background:#000;"></video>
    </section>

    <div class="steps" id="pasos"></div>

    <p class="lede" id="copia"></p>
  </main>
  <script>
    const $ = (selector) => document.querySelector(selector);
    const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

    async function start() {
      const info = await (await fetch("/api/estado")).json();
      const next = info.siguiente;
      $("#siguiente").innerHTML = `
        <h2>Lo que sigue</h2>
        <p>${next.texto}</p>
        <a class="button" href="${next.enlace}">${next.boton}</a>`;
      const steps = [
        { n: 1, title: "Grupos", href: "/grupos", text: "Crea tu grupo y la lista de alumnos una sola vez.", status: `${plural(info.grupos, "grupo", "grupos")} · ${plural(info.alumnos, "alumno", "alumnos")}`, key: "grupos" },
        { n: 2, title: "Exámenes", href: "/examenes", text: "Crea parciales y finales por bimestre, con su nota total, y escribe sus preguntas ahí mismo.", status: `${plural(info.examenes, "examen", "exámenes")}${info.apagados ? ` · ${plural(info.apagados, "apagado", "apagados")}` : ""}`, key: "examenes" },
        { n: 3, title: "Calificar", href: "/calificar", text: "Escanea las hojas con el celular y sube el PDF. El programa avisa si falta alguna.", status: info.pendientes ? `${plural(info.pendientes, "alumno", "alumnos")} por calificar` : "Nada pendiente", key: "calificar" },
        { n: 4, title: "Notas del año", href: "/notas", text: "Los cuatro bimestres juntos. Se descargan para Excel.", status: "Ver el cuadro", key: "notas" },
        { n: "+", title: "Análisis", href: "/analisis", text: "Qué falló el grupo y hojas de refuerzo para quien lo necesita.", status: "Opcional", key: "analisis" },
      ];
      $("#pasos").innerHTML = steps.map((step) => `
        <div class="step">
          <h3><span class="n">${step.n}</span>${step.title}</h3>
          <p>${step.text}</p>
          <p class="status">${step.status}</p>
          <a class="button ${step.key === next.paso ? "" : "secondary"}" href="${step.href}">Abrir</a>
        </div>`).join("");
      $("#copia").textContent = info.copia
        ? `Copia de seguridad automática: ${info.copia}. Tus datos están solo en esta computadora.`
        : "Tus datos están solo en esta computadora. Se hará una copia de seguridad automática cada día.";
    }
    async function showTutorial() {
      for (const [file, type] of [["/static/tutorial.webm", "video/webm"], ["/static/tutorial.mp4", "video/mp4"]]) {
        try {
          const head = await fetch(file, { method: "HEAD" });
          if (head.ok && $("#video").canPlayType(type)) {
            $("#video").src = file;
            $("#tutorial").hidden = false;
            return;
          }
        } catch { /* sin video: la sección queda oculta */ }
      }
    }

    start();
    showTutorial();
  </script>
</body>
</html>
